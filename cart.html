<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy | Cart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#333;line-height:1.6}
header{background:#1e293b;color:#fff;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{font-size:1.5rem;color:#fbbf24}
nav a{color:#fff;text-decoration:none;margin-left:18px}
nav a:hover,nav a.active{color:#fbbf24}
.badge{background:#ef4444;border-radius:50%;padding:1px 7px;font-size:.8rem}
main{max-width:1000px;margin:25px auto;padding:0 20px;min-height:60vh}
.btn{background:#f59e0b;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:1rem;text-decoration:none;display:inline-block}
.btn:hover{background:#d97706}
footer{background:#1e293b;color:#fff;text-align:center;padding:15px;margin-top:30px}
.item{background:#fff;display:flex;align-items:center;gap:15px;padding:15px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);flex-wrap:wrap}
.item .img{font-size:2.5rem}
.item .info{flex:1;min-width:150px}
.qty button{width:30px;height:30px;border:1px solid #ccc;background:#fff;border-radius:5px;cursor:pointer;font-size:1.1rem}
.qty span{display:inline-block;min-width:30px;text-align:center}
.remove{background:#ef4444;color:#fff;border:none;padding:7px 12px;border-radius:5px;cursor:pointer}
.total{text-align:right;margin-top:20px;font-size:1.3rem}
#empty{text-align:center;padding:40px;display:none}
</style>
</head>
<body>
<header>
  <div class="logo">🛒 ShopEasy</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html" class="active">Cart <span class="badge" id="cart-count">0</span></a>
    <a href="login.html">Login</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <h2 style="margin-bottom:15px">Your Cart</h2>
  <div id="items"></div>
  <div id="empty">
    <p>Your cart is empty.</p><br>
    <a href="products.html" class="btn">Continue Shopping</a>
  </div>
  <div id="summary" style="display:none">
    <div class="total">Total: <strong id="total">₹0</strong></div>
    <div style="text-align:right;margin-top:15px">
      <button class="remove" id="clear">Clear Cart</button>
      <a href="checkout.html" class="btn">Proceed to Checkout</a>
    </div>
  </div>
</main>

<footer><p>&copy; 2026 ShopEasy. All rights reserved.</p></footer>

<script>
const getCart=()=>JSON.parse(localStorage.getItem('cart')||'[]');
const saveCart=c=>{localStorage.setItem('cart',JSON.stringify(c));updateCount();};
function updateCount(){const el=document.getElementById('cart-count');if(el)el.textContent=getCart().reduce((s,i)=>s+i.qty,0);}
updateCount();

function render(){
  const cart=getCart();
  const box=document.getElementById('items');
  box.innerHTML='';
  document.getElementById('empty').style.display=cart.length?'none':'block';
  document.getElementById('summary').style.display=cart.length?'block':'none';

  let total=0;
  cart.forEach(item=>{
    total+=item.price*item.qty;
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`
      <div class="img">${item.img}</div>
      <div class="info"><h4>${item.name}</h4><div>₹${item.price}</div></div>
      <div class="qty">
        <button data-act="dec">−</button><span>${item.qty}</span><button data-act="inc">+</button>
      </div>
      <div><strong>₹${item.price*item.qty}</strong></div>
      <button class="remove" data-act="rm">Remove</button>`;
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>change(item.id,b.dataset.act));
    box.appendChild(d);
  });
  document.getElementById('total').textContent='₹'+total;
}

function change(id,act){
  let cart=getCart();
  const it=cart.find(i=>i.id===id);
  if(act==='inc') it.qty++;
  if(act==='dec') it.qty--;
  if(act==='rm'||it.qty<=0) cart=cart.filter(i=>i.id!==id);
  saveCart(cart);render();
}

document.getElementById('clear').onclick=()=>{
  if(confirm('Remove all items?')){saveCart([]);render();}
};
render();
</script>
</body>
</html>
